
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배달머니 - Delivery Money</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f6fa;
      color: #20242c;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      gap: 15px;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      color: #13a87b;
    }

    .subtitle {
      color: #777;
      margin-top: 5px;
    }

    .date {
      color: #666;
    }

    .section-title {
      font-size: 19px;
      margin: 25px 0 15px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .card, .panel, .history, .auth-panel {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.04);
    }

    .card-label {
      color: #777;
      font-size: 14px;
    }

    .card-value {
      font-size: 23px;
      font-weight: bold;
      margin-top: 12px;
      word-break: break-word;
    }

    .green {
      color: #13a87b;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn {
      width: 100%;
      margin-top: 20px;
      background: #13a87b;
      color: white;
      padding: 15px;
    }

    .auth-panel {
      margin-bottom: 25px;
    }

    .auth-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .login-btn {
      flex: 1;
      background: #13a87b;
      color: white;
    }

    .signup-btn {
      flex: 1;
      background: #20242c;
      color: white;
    }

    .logout-btn {
      background: #eee;
      color: #333;
    }

    .auth-status {
      font-size: 13px;
      color: #777;
      margin-top: 12px;
      line-height: 1.6;
    }

    .history {
      margin-top: 25px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    th, td {
      padding: 13px 10px;
      border-bottom: 1px solid #eee;
      text-align: center;
      font-size: 13px;
    }

    th {
      background: #f8f9fb;
    }

    .delete-btn {
      background: #fff0f0;
      color: #d44;
    }

    .tools {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .csv-btn {
      background: #13a87b;
      color: white;
    }

    .backup-btn {
      background: #20242c;
      color: white;
    }

    .restore-btn {
      background: #e9efff;
      color: #3559a6;
    }

    .sync-status {
      margin-top: 10px;
      font-size: 13px;
      color: #777;
    }

    @media (max-width: 750px) {
      body {
        padding: 12px;
      }

      header {
        align-items: flex-start;
      }

      .logo {
        font-size: 22px;
      }

      .dashboard {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .card {
        padding: 16px;
      }

      .card-value {
        font-size: 19px;
      }

      .content-grid {
        grid-template-columns: 1fr;
      }

      .panel, .history, .auth-panel {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div>
      <div class="logo">DELIVERY MONEY</div>
      <div class="subtitle">나의 배달 수익 관리 대시보드</div>
    </div>
    <div class="date" id="today"></div>
  </header>

  <!-- 로그인 영역 -->
  <div class="auth-panel">

    <h2 class="section-title">계정 로그인</h2>

    <div id="authForm">
      <label>이메일</label>
      <input type="email" id="email" placeholder="이메일 주소">

      <label>비밀번호</label>
      <input type="password" id="password" placeholder="비밀번호">

      <div class="auth-buttons">
        <button class="login-btn" onclick="login()">로그인</button>
        <button class="signup-btn" onclick="signup()">회원가입</button>
      </div>
    </div>

    <div id="userArea" style="display:none;">
      <div id="userEmail"></div>
      <button class="logout-btn" onclick="logout()" style="margin-top:12px;">
        로그아웃
      </button>
    </div>

    <div class="auth-status" id="authStatus">
      로그인하면 배달 기록을 클라우드에 저장할 수 있습니다.
    </div>

    <div class="sync-status" id="syncStatus">
      현재 브라우저 저장소 사용 중
    </div>

  </div>

  <!-- 대시보드 -->
  <h2 class="section-title">오늘의 실적</h2>

  <div class="dashboard">

    <div class="card">
      <div class="card-label">오늘 총수입</div>
      <div class="card-value green" id="totalIncome">0원</div>
    </div>

    <div class="card">
      <div class="card-label">오늘 순수익</div>
      <div class="card-value" id="netIncome">0원</div>
    </div>

    <div class="card">
      <div class="card-label">오늘 배달 건수</div>
      <div class="card-value" id="totalOrders">0건</div>
    </div>

    <div class="card">
      <div class="card-label">시간당 순수익</div>
      <div class="card-value" id="hourlyIncome">0원</div>
    </div>

  </div>

  <div class="content-grid">

    <!-- 기록 입력 -->
    <div class="panel">

      <h2 class="section-title">오늘의 배달 기록</h2>

      <label>날짜</label>
      <input type="date" id="date">

      <label>배민커넥트 수입 (원)</label>
      <input type="number" id="baemin" placeholder="예: 65000" min="0">

      <label>배민 배달 건수</label>
      <input type="number" id="baeminOrders" placeholder="예: 15" min="0">

      <label>쿠팡이츠 수입 (원)</label>
      <input type="number" id="coupang" placeholder="예: 42000" min="0">

      <label>쿠팡 배달 건수</label>
      <input type="number" id="coupangOrders" placeholder="예: 10" min="0">

      <label>오늘 운행 시간 (시간)</label>
      <input type="number" id="hours" placeholder="예: 5" min="0" step="0.5">

      <label>오늘 지출 (원)</label>
      <input type="number" id="expenses" placeholder="예: 8000" min="0">

      <button class="btn" onclick="saveRecord()">
        오늘 기록 저장하기
      </button>

    </div>

    <!-- 수익 분석 -->
    <div class="panel">

      <h2 class="section-title">수익 분석</h2>

      <div class="card-label">배민커넥트 수입</div>
      <div class="card-value" id="showBaemin">0원</div>

      <br><br>

      <div class="card-label">쿠팡이츠 수입</div>
      <div class="card-value" id="showCoupang">0원</div>

      <br><br>

      <div class="card-label">총 지출</div>
      <div class="card-value" id="showExpenses">0원</div>

      <br><br>

      <div class="card-label">실제 남은 수익</div>
      <div class="card-value green" id="showNet">0원</div>

    </div>

  </div>

  <!-- 기록 내역 -->
  <div class="history">

    <h2 class="section-title">📊 배달 기록 내역</h2>

    <div class="tools">

      <button class="csv-btn" onclick="downloadCSV()">
        📊 엑셀 다운로드
      </button>

      <button class="backup-btn" onclick="backupData()">
        💾 전체 백업
      </button>

      <button class="restore-btn"
        onclick="document.getElementById('restoreFile').click()">
        📂 백업 복구
      </button>

      <input
        type="file"
        id="restoreFile"
        accept=".json"
        style="display:none"
        onchange="restoreData(event)"
      >

    </div>

    <table>

      <thead>
        <tr>
          <th>날짜</th>
          <th>배민 수입</th>
          <th>쿠팡 수입</th>
          <th>총수입</th>
          <th>지출</th>
          <th>순수익</th>
          <th>배달 건수</th>
          <th>관리</th>
        </tr>
      </thead>

      <tbody id="recordList"></tbody>

    </table>

  </div>

</div>

<!-- Supabase 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  // ==================================
  // 1. Supabase 연결
  // ==================================

  const SUPABASE_URL =
    "https://xjmajvanaocdpzhyyauj.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_ITY48H-kfqCDAiRq0h-pKg_D88eP9vF";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  // ==================================
  // 2. 기본 데이터
  // ==================================

  let records = JSON.parse(
    localStorage.getItem("deliveryRecords") || "[]"
  );

  let currentUser = null;

  const today = new Date();

  document.getElementById("today").textContent =
    today.getFullYear() + "년 " +
    (today.getMonth() + 1) + "월 " +
    today.getDate() + "일";

  document.getElementById("date").value =
    today.toLocaleDateString("sv-SE");

  function won(number) {
    return Number(number || 0).toLocaleString("ko-KR") + "원";
  }

  function updateLocalStorage() {
    localStorage.setItem(
      "deliveryRecords",
      JSON.stringify(records)
    );
  }

  // ==================================
  // 3. 회원가입
  // ==================================

  async function signup() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      alert("이메일과 비밀번호를 입력해주세요.");
      return;
    }

    if (password.length < 6) {
      alert("비밀번호는 6자 이상 입력해주세요.");
      return;
    }

    setAuthStatus("회원가입 처리 중...");

    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

    if (error) {
      alert("회원가입 실패: " + error.message);
      setAuthStatus("회원가입에 실패했습니다.");
      return;
    }

    if (data.session) {
      alert("회원가입 및 로그인이 완료되었습니다!");
    } else {
      alert(
        "회원가입 신청이 완료되었습니다.\n" +
        "이메일로 전송된 인증 링크를 확인한 후 로그인해주세요."
      );
    }

  }

  // ==================================
  // 4. 로그인
  // ==================================

  async function login() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      alert("이메일과 비밀번호를 입력해주세요.");
      return;
    }

    setAuthStatus("로그인 중...");

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      alert("로그인 실패: " + error.message);
      setAuthStatus("로그인에 실패했습니다.");
      return;
    }

    currentUser = data.user;

    await updateAuthUI();
    await syncRecords();

  }

  // ==================================
  // 5. 로그아웃
  // ==================================

  async function logout() {

    const { error } = await supabaseClient.auth.signOut();

    if (error) {
      alert("로그아웃 실패: " + error.message);
      return;
    }

    currentUser = null;

    document.getElementById("authForm").style.display = "block";
    document.getElementById("userArea").style.display = "none";

    setAuthStatus("로그아웃되었습니다.");
    document.getElementById("syncStatus").textContent =
      "현재 브라우저 저장소 사용 중";

  }

  function setAuthStatus(message) {
    document.getElementById("authStatus").textContent = message;
  }

  // ==================================
  // 6. 로그인 화면 업데이트
  // ==================================

  async function updateAuthUI() {

    if (currentUser) {

      document.getElementById("authForm").style.display = "none";
      document.getElementById("userArea").style.display = "block";

      document.getElementById("userEmail").textContent =
        "로그인 계정: " + currentUser.email;

      setAuthStatus("로그인되었습니다.");

    } else {

      document.getElementById("authForm").style.display = "block";
      document.getElementById("userArea").style.display = "none";

    }

  }

  // ==================================
  // 7. 클라우드 데이터 변환
  // ==================================

  function toCloudRecord(record) {

    return {
      user_id: currentUser.id,
      delivery_date: record.date,
      baemin_income: Number(record.baemin) || 0,
      baemin_orders: Number(record.baeminOrders) || 0,
      coupang_income: Number(record.coupang) || 0,
      coupang_orders: Number(record.coupangOrders) || 0,
      working_hours: Number(record.hours) || 0,
      expenses: Number(record.expenses) || 0
    };

  }

  function fromCloudRecord(record) {

    const baemin = Number(record.baemin_income) || 0;
    const coupang = Number(record.coupang_income) || 0;
    const expenses = Number(record.expenses) || 0;

    const baeminOrders = Number(record.baemin_orders) || 0;
    const coupangOrders = Number(record.coupang_orders) || 0;

    return {
      date: record.delivery_date,
      baemin: baemin,
      baeminOrders: baeminOrders,
      coupang: coupang,
      coupangOrders: coupangOrders,
      hours: Number(record.working_hours) || 0,
      expenses: expenses,
      total: baemin + coupang,
      net: baemin + coupang - expenses,
      orders: baeminOrders + coupangOrders
    };

  }

  // ==================================
  // 8. 클라우드 동기화
  // ==================================

  async function syncRecords() {

    if (!currentUser) return;

    setSyncStatus("클라우드 데이터 확인 중...");

    try {

      const { data: cloudData, error } =
        await supabaseClient
          .from("delivery_records")
          .select("*")
          .eq("user_id", currentUser.id);

      if (error) throw error;

      const cloudRecords = cloudData.map(fromCloudRecord);

      // 클라우드 기록을 우선하고
      // 로컬에만 있는 기록은 추가한다.
      const merged = [...cloudRecords];

      records.forEach(localRecord => {

        const exists = merged.some(
          item => item.date === localRecord.date
        );

        if (!exists) {
          merged.push(localRecord);
        }

      });

      records = merged;

      updateLocalStorage();

      // 합쳐진 기록을 클라우드에 저장
      if (records.length > 0) {

        const uploadData = records.map(toCloudRecord);

        const { error: uploadError } =
          await supabaseClient
            .from("delivery_records")
            .upsert(uploadData, {
              onConflict: "user_id,delivery_date"
            });

        if (uploadError) throw uploadError;

      }

      renderRecords();
      updateDashboard();

      setSyncStatus("클라우드 동기화 완료");

    } catch (error) {

      console.error("동기화 오류:", error);

      setSyncStatus("동기화 실패: " + error.message);

      alert(
        "클라우드 동기화 중 오류가 발생했습니다.\n" +
        error.message
      );

    }

  }

  function setSyncStatus(message) {
    document.getElementById("syncStatus").textContent = message;
  }

  // ==================================
  // 9. 배달 기록 저장
  // ==================================

  async function saveRecord() {

    const date = document.getElementById("date").value;

    const baemin =
      Number(document.getElementById("baemin").value) || 0;

    const baeminOrders =
      Number(document.getElementById("baeminOrders").value) || 0;

    const coupang =
      Number(document.getElementById("coupang").value) || 0;

    const coupangOrders =
      Number(document.getElementById("coupangOrders").value) || 0;

    const hours =
      Number(document.getElementById("hours").value) || 0;

    const expenses =
      Number(document.getElementById("expenses").value) || 0;

    if (!date) {
      alert("날짜를 선택해주세요.");
      return;
    }

    if (
      [baemin, baeminOrders, coupang, coupangOrders, hours, expenses]
      .some(value => value < 0)
    ) {
      alert("음수는 입력할 수 없습니다.");
      return;
    }

    const total = baemin + coupang;
    const net = total - expenses;

    const record = {
      date,
      baemin,
      baeminOrders,
      coupang,
      coupangOrders,
      hours,
      expenses,
      total,
      net,
      orders: baeminOrders + coupangOrders
    };

    const index = records.findIndex(r => r.date === date);

    if (index !== -1) {
      records[index] = record;
    } else {
      records.push(record);
    }

    updateLocalStorage();

    renderRecords();
    updateDashboard();

    if (currentUser) {

      setSyncStatus("기록 클라우드 저장 중...");

      const { error } = await supabaseClient
        .from("delivery_records")
        .upsert(
          toCloudRecord(record),
          { onConflict: "user_id,delivery_date" }
        );

      if (error) {

        console.error(error);

        alert("기록은 브라우저에 저장했지만 클라우드 저장에 실패했습니다.\n" + error.message);

        setSyncStatus("클라우드 저장 실패");

        return;

      }

      setSyncStatus("클라우드 저장 완료");

    } else {

      setSyncStatus("브라우저에 저장 완료 - 로그인하면 클라우드에 동기화됩니다.");

    }

    alert("배달 기록이 저장되었습니다!");

  }

  // ==================================
  // 10. 대시보드 업데이트
  // ==================================

  function updateDashboard() {

    const date = document.getElementById("date").value;

    const todayRecord = records.find(r => r.date === date);

    if (!todayRecord) {

      document.getElementById("totalIncome").textContent = "0원";
      document.getElementById("netIncome").textContent = "0원";
      document.getElementById("totalOrders").textContent = "0건";
      document.getElementById("hourlyIncome").textContent = "0원";

      document.getElementById("showBaemin").textContent = "0원";
      document.getElementById("showCoupang").textContent = "0원";
      document.getElementById("showExpenses").textContent = "0원";
      document.getElementById("showNet").textContent = "0원";

      return;

    }

    document.getElementById("totalIncome").textContent =
      won(todayRecord.total);

    document.getElementById("netIncome").textContent =
      won(todayRecord.net);

    document.getElementById("totalOrders").textContent =
      todayRecord.orders + "건";

    document.getElementById("hourlyIncome").textContent =
      won(
        todayRecord.hours > 0
          ? Math.round(todayRecord.net / todayRecord.hours)
          : 0
      );

    document.getElementById("showBaemin").textContent =
      won(todayRecord.baemin);

    document.getElementById("showCoupang").textContent =
      won(todayRecord.coupang);

    document.getElementById("showExpenses").textContent =
      won(todayRecord.expenses);

    document.getElementById("showNet").textContent =
      won(todayRecord.net);

  }

  // ==================================
  // 11. 기록 목록 출력
  // ==================================

  function renderRecords() {

    const list = document.getElementById("recordList");

    list.innerHTML = "";

    const sorted = [...records].sort(
      (a, b) => b.date.localeCompare(a.date)
    );

    sorted.forEach(r => {

      const row = document.createElement("tr");

      const values = [
        r.date,
        won(r.baemin),
        won(r.coupang),
        won(r.total),
        won(r.expenses),
        won(r.net),
        (r.orders || 0) + "건"
      ];

      values.forEach(value => {

        const cell = document.createElement("td");
        cell.textContent = value;
        row.appendChild(cell);

      });

      const actionCell = document.createElement("td");

      const deleteButton = document.createElement("button");

      deleteButton.className = "delete-btn";
      deleteButton.textContent = "삭제";

      deleteButton.onclick = () => deleteRecord(r.date);

      actionCell.appendChild(deleteButton);
      row.appendChild(actionCell);

      list.appendChild(row);

    });

  }

  // ==================================
  // 12. 기록 삭제
  // ==================================

  async function deleteRecord(date) {

    if (!confirm("이 날짜의 기록을 삭제할까요?")) return;

    records = records.filter(r => r.date !== date);

    updateLocalStorage();

    renderRecords();
    updateDashboard();

    if (currentUser) {

      const { error } = await supabaseClient
        .from("delivery_records")
        .delete()
        .eq("user_id", currentUser.id)
        .eq("delivery_date", date);

      if (error) {

        alert("클라우드 삭제 실패: " + error.message);
        setSyncStatus("클라우드 삭제 실패");

        return;

      }

      setSyncStatus("클라우드 삭제 완료");

    }

  }

  // ==================================
  // 13. CSV 엑셀 다운로드
  // ==================================

  function downloadCSV() {

    if (records.length === 0) {
      alert("다운로드할 기록이 없습니다.");
      return;
    }

    const header = [
      "날짜",
      "배민 수입",
      "배민 배달 건수",
      "쿠팡 수입",
      "쿠팡 배달 건수",
      "운행 시간",
      "지출",
      "총수입",
      "순수익",
      "총배달 건수"
    ];

    const rows = records.map(r => [
      r.date,
      r.baemin,
      r.baeminOrders,
      r.coupang,
      r.coupangOrders,
      r.hours,
      r.expenses,
      r.total,
      r.net,
      r.orders
    ]);

    const csv = [header, ...rows]
      .map(row => row.join(","))
      .join("\n");

    const blob = new Blob(
      ["\uFEFF" + csv],
      { type: "text/csv;charset=utf-8;" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "배달머니_배달기록.csv";

    link.click();

    setTimeout(() => URL.revokeObjectURL(url), 1000);

  }

  // ==================================
  // 14. 전체 데이터 백업
  // ==================================

  function backupData() {

    const backup = {
      appName: "Delivery Money",
      version: 1,
      backupDate: new Date().toISOString(),
      records: records
    };

    const blob = new Blob(
      [JSON.stringify(backup, null, 2)],
      { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "배달머니_전체백업.json";

    link.click();

    setTimeout(() => URL.revokeObjectURL(url), 1000);

    alert("전체 데이터 백업이 완료되었습니다!");

  }

  // ==================================
  // 15. 백업 파일 복구
  // ==================================

  async function restoreData(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = async function(e) {

      try {

        const backup = JSON.parse(e.target.result);

        if (
          backup.appName !== "Delivery Money" ||
          !Array.isArray(backup.records)
        ) {
          alert("올바른 배달머니 백업 파일이 아닙니다.");
          return;
        }

        if (!confirm(
          "백업 기록을 현재 데이터에 추가하거나 갱신합니다.\n" +
          "같은 날짜의 기록은 백업 내용으로 교체됩니다.\n" +
          "계속할까요?"
        )) {
          return;
        }

        backup.records.forEach(record => {

          const index = records.findIndex(
            r => r.date === record.date
          );

          if (index !== -1) {
            records[index] = record;
          } else {
            records.push(record);
          }

        });

        updateLocalStorage();

        renderRecords();
        updateDashboard();

        if (currentUser) {
          await syncRecords();
        }

        alert("데이터 복구가 완료되었습니다!");

      } catch (error) {

        alert("파일을 읽을 수 없습니다. 백업 파일을 확인해주세요.");

      }

      event.target.value = "";

    };

    reader.readAsText(file);

  }

  // ==================================
  // 16. 날짜 변경
  // ==================================

  document.getElementById("date").addEventListener(
    "change",
    updateDashboard
  );

  // ==================================
  // 17. 로그인 상태 자동 확인
  // ==================================

  async function initializeApp() {

    renderRecords();
    updateDashboard();

    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error) {
      console.error(error);
      setAuthStatus("로그인 상태를 확인하지 못했습니다.");
      return;
    }

    currentUser = data.session
      ? data.session.user
      : null;

    await updateAuthUI();

    if (currentUser) {
      await syncRecords();
    }

    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        currentUser = session
          ? session.user
          : null;

        await updateAuthUI();

        if (event === "SIGNED_IN") {
          await syncRecords();
        }

        if (event === "SIGNED_OUT") {
          setSyncStatus("로그아웃되었습니다.");
        }

      }
    );

  }

  initializeApp();

  console.log("배달머니 Supabase 연결 준비 완료!");

</script>
